// ── Ideas: the research desk's cards (R6.1, D21) ─────────────────────────────
function httpsUrl(url) {
  if (typeof url !== "string") return null;
  try {
    const parsed = new URL(url);
    return parsed.protocol === "https:" ? parsed.href : null;
  } catch (error) { return null; }
}
function sourceLabel(card) {
  if (typeof card.sourceName === "string" && card.sourceName !== "") return card.sourceName;
  const source = String(card.source || "");
  if (source.indexOf("x:") === 0) return "@" + source.slice(2) + " on X";
  if (source.indexOf("youtube:") === 0) return "YouTube";
  return source;
}
const VERDICT_DOT = { signal: "dot-ok", fact: "", hype: "dot-attention", unknown: "" };

function paintIdeas() {
  const host = $("ideas");
  const note = $("ideas-note");
  if (!host || !note) return;
  clear(host);
  clear(note);
  if (!view.state) { host.append(h("li", { class: "empty", text: "Reading…" })); return; }
  if (panelMissing("ideas")) { host.append(h("li", { class: "empty", text: EMPTY.notWired })); return; }
  if (panelError("ideas")) { host.append(h("li", { class: "empty", text: panelError("ideas") })); return; }
  const data = panelData("ideas") || {};
  const cards = Array.isArray(data.cards) ? data.cards : [];
  const onPage = {};
  cards.forEach((card) => { onPage[card.id] = true; });
  const pinned = Object.keys(failedCards).filter((id) => !onPage[id]).map((id) => failedCards[id].card);
  const all = pinned.concat(cards);
  if (data.late) note.append(h("p", { class: "note", text: EMPTY.ideasLate }));
  if (all.length === 0) {
    if (!data.late) host.append(h("li", { class: "empty", text: EMPTY.noIdeas }));
    return;
  }
  all.slice(0, 3).forEach((card) => host.append(h("li", null, ideaNode(card))));
}

function ideaNode(card) {
  const node = h("article", { class: "idea", "aria-label": "Idea" });
  const url = httpsUrl(card.url);
  const verdict = typeof card.verdict === "string" ? card.verdict : "unknown";
  node.append(h("span", { class: "idea-title", text: card.title }));
  const meta = h("div", { class: "idea-meta" },
    h("span", { class: "verdict" }, h("span", { class: "dot " + (VERDICT_DOT[verdict] || "") }), h("span", { text: verdict })),
    h("span", { text: sourceLabel(card) }));
  if (url) {
    meta.append(h("a", { class: "idea-link", href: url, target: "_blank", rel: "noopener noreferrer", "aria-label": "Open the link for " + card.title, text: "Open link" }));
  } else if (card.url) {
    meta.append(h("span", { class: "dim", text: String(card.url) }));
  }
  node.append(meta);
  if (card.sentences) node.append(h("p", { class: "idea-why", text: card.sentences }));

  const record = heldCards[card.id];
  const failed = failedCards[card.id];
  if (record) {
    const undo = record.posted ? null : h("button", { class: "btn", type: "button", "data-focus": "card-undo:" + card.id, text: "Undo" });
    if (undo) undo.addEventListener("click", () => undoCard(card.id));
    node.append(h("div", { class: "answered" }, h("span", { text: cardSaid(record.tap) }), undo));
    return node;
  }
  if (failed) {
    const retry = h("button", { class: "btn btn-solid", type: "button", "data-focus": "card-retry:" + card.id, text: "Retry" });
    retry.addEventListener("click", () => retryCard(card.id));
    node.append(h("div", { class: "answered" }, h("span", { text: "Saved, not delivered yet. Retry." }), retry));
    return node;
  }
  const taps = Array.isArray(card.taps) ? card.taps : [];
  const actions = h("div", { class: "idea-actions", role: "group", "aria-label": "Actions for " + card.title });
  CARD_TAPS.forEach((entry) => {
    if (entry.tap === "dig-deeper" && (taps.indexOf("dig-deeper") >= 0 || card.hasReport)) {
      if (card.hasReport) {
        const open = h("button", { class: "btn btn-solid", type: "button", "data-focus": "card-report:" + card.id, text: "Open the report" });
        open.addEventListener("click", () => openReport(card));
        actions.append(open);
      } else {
        actions.append(h("span", { class: "tag", text: "Digging deeper" }));
      }
      return;
    }
    const button = h("button", { class: "btn", type: "button", "data-focus": "card-tap:" + card.id + ":" + entry.tap, text: entry.label });
    button.addEventListener("click", () => tapCard(card, entry.tap));
    actions.append(button);
  });
  node.append(actions);
  return node;
}

function cardSaid(tap) {
  for (let index = 0; index < CARD_TAPS.length; index += 1) if (CARD_TAPS[index].tap === tap) return CARD_TAPS[index].said;
  return "Noted.";
}

// A tap is held for six seconds with Undo, then posted (D9, R6.1).
function tapCard(card, tap) {
  if (heldCards[card.id]) return;
  heldCards[card.id] = { tap, version: card.version, timer: null, posted: false, card };
  paintIdeas();
  showToast(cardSaid(tap), "Undo", () => undoCard(card.id));
  heldCards[card.id].timer = setTimeout(() => postCard(card.id), HOLD_MS);
}

function undoCard(id) {
  const record = heldCards[id];
  if (!record || record.posted) return;
  if (record.timer !== null) clearTimeout(record.timer);
  delete heldCards[id];
  hideToast();
  paintIdeas();
  const button = document.querySelector('[data-focus="card-tap:' + id + ':' + record.tap + '"]');
  if (button) button.focus();
}

function postCard(id, keepalive) {
  const record = heldCards[id];
  if (!record || record.posted) return;
  if (record.timer !== null) clearTimeout(record.timer);
  record.posted = true;
  postAct({ action: "card", id, version: record.version, tap: record.tap }, { keepalive })
    .then((result) => {
      if (result.status === 202) { delete heldCards[id]; showPcWaiting(); paintIdeas(); return refresh(); }
      if (result.status === 200) {
        delete failedCards[id];
        hideToast();
        return refresh().then(() => { delete heldCards[id]; paintIdeas(); });
      }
      delete heldCards[id];
      if (result.status === 502) {
        failedCards[id] = { card: record.card, tap: record.tap, version: record.version };
        showToast("Saved, not delivered yet. Retry.", null, null);
        return refresh();
      }
      if (result.status === 403) { showRestart(); paintIdeas(); return null; }
      if (result.status === 409) showToast("This card changed. Your tap was not sent.", null, null);
      else if (result.status === 404) showToast("That card is gone.", null, null);
      else showToast(String((result.data && result.data.error) || "The tap was refused."), null, null);
      paintIdeas();
      return refresh();
    })
    .catch(() => {
      delete heldCards[id];
      showToast("The tap did not reach the gateway.", null, null);
      paintIdeas();
    });
}

function retryCard(id) {
  const failed = failedCards[id];
  if (!failed || heldCards[id]) return;
  heldCards[id] = { tap: failed.tap, version: failed.version, timer: null, posted: false, card: failed.card };
  delete failedCards[id];
  postCard(id);
}

// The report of a card opens in the sheet as plain text (D21).
function openReport(card) {
  view.ui.dialog = { kind: "report", card: card.id, title: card.title };
  if (!view.reports[card.id]) {
    view.reports[card.id] = { loading: true };
    fetch("/cc/api/report?card=" + encodeURIComponent(card.id), { cache: "no-store" })
      .then((response) => {
        if (response.status === 404) return { error: "No report is attached to this card." };
        if (!response.ok) return { error: "The gateway answered " + response.status + "." };
        return response.text().then((text) => ({ text }));
      })
      .catch(() => ({ error: "The report could not be read." }))
      .then((result) => {
        view.reports[card.id] = result;
        if (view.ui.dialog && view.ui.dialog.kind === "report" && view.ui.dialog.card === card.id) paintDialog();
      });
  }
  paintDialog();
}

// ── Messages (MG7) ─────────────────────────────────────────────────────────
function paintMessages() {
  const card = $("messages-card");
  if (!card) return;
  const list = $("messages");
  const strip = $("msg-strip");
  const served = view.state && view.state.panels ? view.state.panels.messages : null;
  if (!view.state) { card.hidden = false; return; }
  if (!served && msgView.panel === null && !msgView.countsOnly) { card.hidden = true; return; }
  card.hidden = false;
  clear(list);
  if (msgView.countsOnly) {
    // The PC view carries the counts and nothing else (G11).
    const counts = served && served.data && served.data.counts ? served.data.counts : null;
    strip.className = "msg-strip";
    setText(strip, counts === null ? "Messages" : plural(counts.draftsWaiting, "draft waits", "drafts wait") + " · open on your phone");
    return;
  }
  if (msgView.error) {
    strip.className = "msg-strip error";
    setText(strip, "Messages could not be read");
    list.append(h("li", { class: "empty", role: "alert", text: msgView.error }));
    return;
  }
  if (!msgView.panel) {
    strip.className = "msg-strip";
    setText(strip, "Reading the messages…");
    return;
  }
  strip.className = "msg-strip " + (msgView.panel.strip && msgView.panel.strip.tone ? msgView.panel.strip.tone : "");
  setText(strip, msgView.panel.strip ? msgView.panel.strip.text : "");
  if (msgView.panel.empty) list.append(h("li", { class: "empty", text: msgView.panel.empty }));
  const rows = Array.isArray(msgView.panel.rows) ? msgView.panel.rows : [];
  rows.forEach((row) => {
    const inner = h("div", null,
      h("div", { class: "msg-top" }, h("span", { text: row.name || "Unnamed chat" }), h("span", { class: "msg-side " + row.state, text: row.line })),
      row.preview ? h("div", { class: "msg-preview", text: row.preview }) : null);
    if (row.draftId) {
      const open = h("button", { class: "msg-open", type: "button", "data-draft": row.draftId, "aria-label": "Open the reply with " + (row.name || "this chat") }, inner);
      open.addEventListener("click", () => openMessageThread(row.draftId));
      list.append(h("li", { class: "msgrow" }, open));
    } else {
      list.append(h("li", { class: "msgrow" }, h("div", { class: "static" }, inner)));
    }
  });
}

function loadMessages() {
  return fetch("/cc/api/messages", { cache: "no-store", headers: { accept: "application/json" } })
    .then((response) => {
      if (response.status === 404) { msgView.countsOnly = true; msgView.error = null; msgView.panel = null; return null; }
      if (!response.ok) throw new Error("the gateway answered " + response.status);
      return response.json();
    })
    .then((body) => {
      if (body === null) return;
      msgView.countsOnly = false;
      msgView.panel = body.panel || null;
      msgView.error = null;
      msgView.loaded = true;
    })
    .catch(() => {
      if (msgView.countsOnly) return;
      msgView.error = "The messages could not be read.";
    })
    .then(() => { paintMessages(); });
}

function openMessageThread(draftId) {
  msgView.open = draftId;
  msgView.thread = null;
  msgView.threadError = null;
  msgView.edit = null;
  msgView.dirty = false;
  msgView.instruction = "";
  msgView.actionError = null;
  view.ui.dialog = { kind: "thread" };
  paintDialog();
  fetch("/cc/api/messages?draft=" + encodeURIComponent(draftId), { cache: "no-store", headers: { accept: "application/json" } })
    .then((response) => {
      if (response.status === 404) return { error: "That thread is not here any more." };
      if (!response.ok) return { error: "The thread could not be read." };
      return response.json();
    })
    .catch(() => ({ error: "The thread could not be read." }))
    .then((body) => {
      if (msgView.open !== draftId) return;
      if (body.error) msgView.threadError = body.error;
      else {
        msgView.thread = body.thread;
        msgView.edit = body.thread && body.thread.draft ? body.thread.draft.text : null;
      }
      paintDialog();
    });
}

function actThread(kind) {
  const thread = msgView.thread;
  if (!thread || !thread.draft || msgView.busy !== null) return;
  const body = { draftId: thread.draft.draftId, hash12: thread.draft.hash12, version: thread.draft.version };
  if (kind === "send") {
    body.action = "msg-edit-send";
    body.text = msgView.edit === null ? thread.draft.text : msgView.edit;
    if (String(body.text).trim() === "") return;
  } else if (kind === "drop") {
    body.action = "msg-drop";
  } else {
    body.action = "msg-redraft";
    const asked = (msgView.instruction || "").trim();
    if (asked !== "") body.instruction = asked;
  }
  msgView.busy = kind;
  msgView.actionError = null;
  paintDialog();
  postAct(body)
    .then((result) => {
      msgView.busy = null;
      if (result.status === 200) {
        msgView.dirty = false;
        msgView.open = null;
        msgView.thread = null;
        msgView.edit = null;
        msgView.instruction = "";
        closeDialog();
        showToast(kind === "send" ? "Approved. The send gate sends it now." : kind === "drop" ? "Dropped." : "A new draft is waiting.", null, null);
        return refresh();
      }
      if (result.status === 403) { showRestart(); return null; }
      if (result.status === 409) msgView.actionError = "This draft changed. Open the thread again.";
      else if (result.status === 404) msgView.actionError = "That draft is gone.";
      else msgView.actionError = String((result.data && result.data.error) || "The action was refused.");
      paintDialog();
      return null;
    })
    .catch(() => {
      msgView.busy = null;
      msgView.actionError = "The action did not reach the gateway.";
      paintDialog();
    });
}

function paintMessageThread(body) {
  const thread = msgView.thread;
  setText($("dialog-title"), thread && thread.name ? thread.name : "Messages");
  if (msgView.threadError) { body.append(h("p", { class: "empty", role: "alert", text: msgView.threadError })); return; }
  if (!thread) { body.append(h("p", { class: "empty", text: "Reading the thread…" })); return; }
  const log = h("div", { class: "thread", tabindex: "0", "aria-label": "The last messages of this chat" });
  thread.messages.forEach((message) => {
    log.append(h("div", { class: "thread-msg" + (message.fromMe ? " mine" : "") }, h("p", { text: message.text }), h("time", { text: hhmm(message.at) })));
  });
  if (thread.messages.length === 0) log.append(h("p", { class: "empty", text: "No message of this chat is on this PC." }));
  body.append(log);
  const tone = thread.state === "sent" ? "ok" : thread.state === "failed" ? "error" : thread.state === "unknown" ? "attention" : "";
  body.append(h("p", { class: "msg-strip " + tone, text: thread.line }));
  if (!thread.draft) {
    const close = h("button", { class: "btn", type: "button", text: "Close" });
    close.addEventListener("click", () => closeDialog());
    body.append(h("div", { class: "thread-actions" }, close));
    return;
  }
  const canAct = thread.draft.version !== "" && msgView.busy === null;
  const box = h("textarea", { id: "cmp-reply", rows: "5", "data-focus": "reply", placeholder: "Write it the way you would say it" });
  box.value = msgView.edit === null ? thread.draft.text : msgView.edit;
  box.addEventListener("input", (event) => { msgView.edit = event.target.value; msgView.dirty = true; syncReplySend(); });
  body.append(h("label", { class: "field-label", for: "cmp-reply", text: "Your reply" }), box);
  body.append(h("p", { class: "reply-note", text: "Send approves the text in this box. Nothing leaves without your tap." }));
  const note = h("input", { id: "cmp-redraft", type: "text", maxlength: "500", placeholder: "What to change (optional)" });
  note.value = msgView.instruction || "";
  note.addEventListener("input", (event) => { msgView.instruction = event.target.value; });
  body.append(h("label", { class: "field-label", for: "cmp-redraft", text: "Draft again" }), note);
  if (msgView.actionError) body.append(h("p", { class: "dialog-error", role: "alert", text: msgView.actionError }));
  if (msgView.busy !== null) body.append(h("p", { class: "msg-strip attention", role: "status", text: msgView.busy === "redraft" ? "Drafting a new reply…" : "Sending your tap…" }));
  if (msgView.busy === null && thread.draft.version === "") body.append(h("p", { class: "reply-note", text: "This draft is not waiting for you any more." }));
  const send = h("button", { class: "btn btn-solid", type: "button", id: "cmp-reply-send", text: "Send" });
  send.disabled = !canAct || String(box.value || "").trim() === "";
  send.addEventListener("click", () => actThread("send"));
  const drop = h("button", { class: "btn", type: "button", text: "Don't send" });
  drop.disabled = !canAct;
  drop.addEventListener("click", () => actThread("drop"));
  const redraft = h("button", { class: "btn", type: "button", text: msgView.busy === "redraft" ? "Drafting…" : "Draft again" });
  redraft.disabled = !canAct;
  redraft.addEventListener("click", () => actThread("redraft"));
  body.append(h("div", { class: "thread-actions" }, drop, redraft, send));
}

function syncReplySend() {
  const button = $("cmp-reply-send");
  if (button) button.disabled = String(msgView.edit || "").trim() === "" || msgView.busy !== null;
}

// ── The message box (D4/WPC) ───────────────────────────────────────────────
function openMessage() {
  view.ui.dialog = { kind: "msg" };
  view.ui.dialogError = null;
  paintDialog();
}

function sendMessage() {
  const text = (view.ui.msg || "").trim();
  if (text === "") return;
  if (text.length > MAX_MESSAGE_CHARS) { view.ui.dialogError = "That is longer than 4000 characters."; paintDialog(); return; }
  const to = view.ui.to;
  postAct({ action: "message", to, text })
    .then((result) => {
      if (result.status === 202) {
        view.ui.msg = "";
        saveDraft("msg", "");
        view.ui.dialogError = null;
        closeDialog();
        showPcWaiting();
        refresh();
        return;
      }
      if (result.status === 200) {
        const name = to === "architect" ? "the architect" : to === "henry" ? "Henry" : "the orchestrator";
        view.ui.msg = "";
        saveDraft("msg", "");
        view.ui.dialogError = null;
        closeDialog();
        showToast("Sent to " + name + " as your words.", null, null);
        return;
      }
      if (result.status === 403) { showRestart(); closeDialog(); return; }
      view.ui.dialogError = result.status === 413 || (result.status === 400 && /long|large/i.test(String(result.data && result.data.error)))
        ? "That message is too long. Keep it under 4000 characters."
        : String((result.data && result.data.error) || "The message was refused.");
      paintDialog();
    })
    .catch(() => {
      view.ui.dialogError = "The message did not reach the gateway. It is still in the box.";
      paintDialog();
    });
}

function stopLane(laneId) {
  postAct({ action: "stop", lane: laneId })
    .then((result) => {
      if (result.status === 202) { showPcWaiting(); refresh(); return; }
      if (result.status === 200) { showToast("Stopping the lane.", null, null); refresh(); return; }
      if (result.status === 403) { showRestart(); return; }
      showToast(String((result.data && result.data.error) || "The lane was not stopped."), null, null);
    })
    .catch(() => { showToast("The stop did not reach the gateway.", null, null); });
}


// ── Answers: your words or a tap, both held six seconds with Undo (R5, D9) ──
function sendAnswer(ticket) {
  const words = (drafts[ticket.id] || "").trim();
  if (words === "") return;
  if (held[ticket.id] && held[ticket.id].timer !== null) clearTimeout(held[ticket.id].timer);
  held[ticket.id] = { code: ticket.code || "", version: ticket.version, words, timer: null };
  view.ui.openTicket = null;
  paintWaiting();
  showToast("Answered. It holds six seconds.", "Undo", () => undoAnswer(ticket.id));
  held[ticket.id].timer = setTimeout(() => postAnswer(ticket.id), HOLD_MS);
}

function tapAnswer(ticket, option) {
  if (held[ticket.id] && held[ticket.id].timer !== null) clearTimeout(held[ticket.id].timer);
  held[ticket.id] = { code: ticket.code || "", version: ticket.version, option, timer: null };
  view.ui.openTicket = null;
  paintWaiting();
  showToast((ticket.code || "Ticket") + " answered with " + option + ".", "Undo", () => undoAnswer(ticket.id));
  held[ticket.id].timer = setTimeout(() => postAnswer(ticket.id), HOLD_MS);
}

function undoAnswer(id) {
  const record = held[id];
  if (!record || record.posted) return;
  if (record.timer !== null) clearTimeout(record.timer);
  const words = record.words;
  delete held[id];
  view.ui.openTicket = id;
  hideToast();
  paintWaiting();
  if (typeof words === "string") {
    const box = $("words-" + id);
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  } else {
    const button = document.querySelector('[data-focus^="tap:' + id + ':"]');
    if (button) button.focus();
  }
}

function postAnswer(id, keepalive) {
  const record = held[id];
  if (!record || record.posted) return;
  if (record.timer !== null) clearTimeout(record.timer);
  record.posted = true;
  const body = { action: "answer", id, version: record.version };
  if (typeof record.words === "string") body.words = record.words;
  else body.option = record.option;
  postAct(body, { keepalive: Boolean(keepalive) })
    .then((result) => {
      if (result.status === 202) { delete held[id]; showPcWaiting(); return refresh(); }
      if (result.status === 200) {
        delete held[id];
        drafts[id] = "";
        saveDraft(id, "");
        hideToast();
        showToast("Sent.", null, null);
        return refresh();
      }
      // Everything else: the words go back in their box, exactly as they were typed.
      delete held[id];
      view.ui.openTicket = id;
      if (typeof record.words === "string") { drafts[id] = record.words; saveDraft(id, record.words); }
      if (result.status === 403) { showRestart(); paintWaiting(); return null; }
      const said = result.status === 409 ? "This ticket changed. Your answer is back in its box." : result.status === 404 ? "That ticket is gone." : result.status === 413 ? "Those words are too long." : String((result.data && result.data.error) || "The answer was refused.");
      showToast(said, null, null);
      paintWaiting();
      return null;
    })
    .catch(() => {
      delete held[id];
      view.ui.openTicket = id;
      if (typeof record.words === "string") { drafts[id] = record.words; saveDraft(id, record.words); }
      showToast("The answer did not reach the gateway. It is back in its box.", null, null);
      paintWaiting();
      return null;
    });
}

function postAct(body, options) {
  return fetch("/cc/api/act", {
    method: "POST",
    cache: "no-store",
    keepalive: Boolean(options && options.keepalive),
    headers: { "content-type": "application/json", "x-cc-csrf": CSRF },
    body: JSON.stringify(body)
  }).then((response) => response.json().catch(() => null).then((data) => ({ status: response.status, data })));
}

// ── The lane sheet (R7.1: a route, so the back gesture closes it) ───────────
/**
 * A record's own word, in a person's words (the operator, 2026-10-29): the sheet and the goals showed the record codes
 * themselves — "review_ready", "sent_back", "decision_conflict" — where a sentence belongs. The record keeps its
 * code; only what a person reads is written out, and a code nobody has named yet reads as its own spaced words
 * rather than as a machine string.
 */
const RECORD_WORDS = {
  review_ready: "Review ready",
  discovery_ready: "Discovery ready",
  already_done: "Already done",
  blocked: "Blocked",
  question: "Question",
  accepted: "Accepted",
  accepted_with_notes: "Accepted with notes",
  rejected: "Sent back",
  sent_back: "Sent back",
  decision_conflict: "Conflict with a decision",
  product_rule: "Product rule",
  schema_change: "Schema change",
  outward_facing: "Outward facing",
  data_deletion: "Deleting data"
};
function plainWords(value) {
  const text = value === null || value === undefined ? "" : String(value);
  if (text === "") return "";
  const named = RECORD_WORDS[text.toLowerCase()];
  if (named !== undefined) return named;
  const spaced = text.replace(/[_-]+/g, " ").trim();
  return spaced.charAt(0).toUpperCase() + spaced.slice(1);
}
function laneRow(laneId) {
  for (const row of laneRows()) if (row.laneId === laneId) return row;
  return null;
}
function loadFeed(laneId, older) {
  const feed = view.feeds[laneId] || { messages: [], more: false, loading: false, error: null, oldest: null };
  if (feed.loading) return Promise.resolve(feed);
  feed.loading = true;
  view.feeds[laneId] = feed;
  const query = older && feed.oldest ? "&before=" + encodeURIComponent(feed.oldest) : "";
  return fetch("/cc/api/feed?lane=" + encodeURIComponent(laneId) + query, { cache: "no-store", headers: { accept: "application/json" } })
    .then((response) => {
      if (response.status === 404) return { absent: true };
      if (!response.ok) throw new Error("the gateway answered " + response.status);
      return response.json();
    })
    .then((body) => {
      feed.loading = false;
      if (!body || body.absent) { feed.error = null; feed.messages = []; feed.more = false; return feed; }
      const lines = Array.isArray(body.messages) ? body.messages : [];
      feed.messages = older ? lines.concat(feed.messages) : lines;
      feed.more = Boolean(body.more);
      feed.oldest = body.oldest || feed.oldest;
      feed.error = null;
      return feed;
    })
    .catch(() => { feed.loading = false; feed.error = "The live session could not be read."; return feed; });
}

/**
 * A lane's state in the words the operator uses for it (the operator, 2026-10-29): working, waiting on review, needs a decision,
 * blocked, done. It reads only what a lane records about itself — its stage, its last report, its tone — so the badge
 * and the board cannot disagree.
 */
function laneStateWords(row, fact) {
  if (fact && fact.merged) return "Done";
  const kind = row.report && row.report.kind ? String(row.report.kind) : "";
  if (kind === "blocked" || row.class === "blocked" || row.tone === "attention") return "Blocked";
  if (kind === "question") return "Needs a decision";
  if (kind === "review_ready" || kind === "discovery_ready") return "Waiting on review";
  if (kind === "already_done") return "Done";
  return "Working";
}
function laneStateTone(state) {
  if (state === "Done") return "on";
  if (state === "Blocked" || state === "Needs a decision") return "back";
  return null;
}

function laneSheetData(row) {
  const index = stageIndexOf(row.stage);
  const fact = index >= 0 ? STAGE_FACTS[index] : null;
  const goal = row.goal ? goalBy(row.goal) : null;
  const feed = view.feeds[row.laneId] || { messages: [], more: false, loading: false, error: null };
  const state = laneStateWords(row, fact);
  const tags = [];
  // The badge comes first: the sheet answers "what is this lane doing" before anything else.
  tags.push({ text: state, tone: laneStateTone(state) });
  if (goal) tags.push({ text: goal.name, tone: null });
  if (row.class) tags.push({ text: plainWords(row.class) + (row.taskKind ? " · " + plainWords(row.taskKind) : ""), tone: null });
  if (row.rounds > 0) tags.push({ text: plural(row.rounds, "fix round", "fix rounds"), tone: "back" });

  const activity = panelData("activity");
  const activityRow = activity && activity[row.laneId] ? activity[row.laneId] : null;
  const facts = [
    { label: "Model", value: row.modelName || "not recorded" },
    { label: "Harness", value: row.harness || "not recorded" },
    { label: "Launched", value: row.startedAt ? hhmm(row.startedAt) : "not recorded" },
    { label: "Elapsed", value: fact && fact.merged ? "merged " + hhmm(row.since) : elapsedText(row.startedAt) || "–" }
  ];
  if (activityRow && typeof activityRow.contextPercent === "number") facts.push({ label: "Context", value: Math.round(activityRow.contextPercent) + "%" });

  const timeline = [];
  if (row.startedAt) timeline.push({ at: hhmm(row.startedAt), text: "Launched", tone: "on" });
  if (row.report) timeline.push({ at: hhmm(row.report.at), text: plainWords(row.report.kind) + (row.report.summary ? " · " + row.report.summary : ""), tone: "on" });
  (Array.isArray(row.handoffs) ? row.handoffs : []).forEach((handoff) => {
    timeline.push({
      at: hhmm(handoff.at),
      text: plainWords(handoff.verdict) + (handoff.cause ? " · " + handoff.cause : ""),
      tone: handoff.verdict === "accepted" ? "on" : "warn"
    });
  });
  if (fact && fact.merged) timeline.push({ at: hhmm(row.since), text: "Finished", tone: "on" });

  // A message with no words of its own is a recorded event, not the word "undefined" (the operator, 2026-10-29).
  const feedLines = feed.messages.map((message) => {
    const said = typeof message.text === "string" && message.text.trim() !== "" ? message.text : plainWords(message.kind) || "a line with no words";
    return hhmm(message.at) + "  " + said;
  });
  const actions = [];
  if (feed.more) actions.push({ action: "older", label: "Older lines" });
  // Only the lane the gateway says may be stopped: the page never decides that itself (R5).
  if (row.canStop) actions.push({ action: "stop", label: "Stop this lane" });
  // A lane waiting on a decision points at the one place a decision is answered; the composer owns the tap (R5).
  if (state === "Needs a decision") actions.push({ action: "decide", label: "Answer the decision" });

  return {
    // The sheet names the work, never the lane's own id (the operator, 2026-10-29).
    title: row.title || "A lane with no name yet",
    sub: goal ? goal.name : state + " now",
    tags,
    facts,
    timeline,
    feed: feedLines.length > 0 ? feedLines : undefined,
    note: feed.error ? feed.error : row.now ? "Now: " + row.now : null,
    actions
  };
}

function openLaneSheet(row) {
  const sheet = $("lane-sheet");
  if (!sheet) return;
  sheet.dataset.lane = row.laneId;
  sheet.data = laneSheetData(row);
  sheet.open();
}

function refreshLaneSheet() {
  const sheet = $("lane-sheet");
  if (!sheet || !sheet.isOpen) return;
  const row = laneRow(sheet.dataset.lane);
  if (!row) return;
  sheet.data = laneSheetData(row);
}

function onLaneSheetTap(event) {
  const sheet = $("lane-sheet");
  const row = sheet ? laneRow(sheet.dataset.lane) : null;
  if (!row) return;
  if (event.detail.action === "stop") {
    if (view.ui.killSeen !== null && view.ui.killSeen === row.laneId) return;
    view.ui.killSeen = row.laneId;
    showToast("Stopping " + (row.title || row.laneId) + ".", "Undo", () => { view.ui.killSeen = null; hideToast(); });
    setTimeout(() => {
      if (view.ui.killSeen !== row.laneId) return;
      view.ui.killSeen = null;
      stopLane(row.laneId);
    }, HOLD_MS);
    return;
  }
  if (event.detail.action === "decide") {
    // Answering belongs to the ticket composer, which holds the options and the record of a tap: the sheet routes
    // there instead of growing a second way to answer (D15/D16).
    // Routing off the lane closes the sheet itself (the back gesture takes the same path).
    go("today", null);
    const target = document.querySelector(".tk-row");
    if (target && typeof target.scrollIntoView === "function") target.scrollIntoView({ block: "center" });
    return;
  }
  if (event.detail.action === "older") {
    loadFeed(row.laneId, true).then(() => {
      sheet.data = laneSheetData(row);
      sheet.open();
    });
  }
}

// ── The sheets with fields: the message box, a thread, a report, the PC facts ─
function paintDialog() {
  const wrap = $("dialog-wrap");
  const body = $("dialog-body");
  const title = $("dialog-title");
  if (!wrap || !body || !title) return;
  const dialog = view.ui.dialog;
  if (!dialog) { wrap.hidden = true; body.textContent = ""; return; }
  wrap.hidden = false;
  clear(body);
  setText(title, "");
  if (dialog.kind === "msg") {
    setText(title, "Message");
    return paintMessageBox(body);
  }
  if (dialog.kind === "thread") return paintMessageThread(body);
  if (dialog.kind === "report") {
    const card = dialog.title || "Report";
    setText(title, card);
    const report = view.reports[dialog.card];
    if (!report || report.loading) body.append(h("p", { class: "empty", text: "Reading the report…" }));
    else if (report.error) body.append(h("p", { class: "empty", role: "alert", text: report.error }));
    else body.append(h("pre", { class: "report-text", text: report.text }));
    const close = h("button", { class: "btn", type: "button", text: "Close" });
    close.addEventListener("click", () => closeDialog());
    body.append(h("div", { class: "dialog-actions" }, close));
    return;
  }
  if (dialog.kind === "pc") {
    const data = panelData("machine");
    setText(title, "This PC");
    if (!data) { body.append(h("p", { class: "empty", text: panelError("machine") || EMPTY.notWired })); }
    else {
      const gate = data.gate || {};
      const facts = [
        { label: "Available", value: typeof gate.availableMb === "number" ? Math.round(gate.availableMb / 1024) + " GB" : "not read" },
        { label: "Gate", value: gate.wouldAdmit === false ? "would refuse" : "would admit" },
        { label: "Paused", value: gate.paused ? "yes" : "no" },
        { label: "Dev server", value: gate.devServerWindow || "closed" },
        { label: "Kills", value: String((Array.isArray(data.kills) ? data.kills.length : 0)) }
      ];
      const grid = h("div", { class: "g-facts" });
      facts.forEach((fact) => grid.append(h("div", { class: "g-fact" }, h("small", { text: fact.label }), h("b", { text: fact.value }))));
      body.append(grid);
      if (gate.reason) body.append(h("p", { class: "dialog-note", text: gate.reason }));
      const kills = Array.isArray(data.kills) ? data.kills : [];
      if (kills.length > 0) {
        const clear = h("button", { class: "btn", type: "button", text: "Clear the warning" });
        clear.addEventListener("click", () => { view.ui.killSeen = kills[kills.length - 1].at; paintIsland(); closeDialog(); });
        body.append(h("div", { class: "dialog-actions" }, clear));
      }
    }
    const close = h("button", { class: "btn btn-solid", type: "button", text: "Close" });
    close.addEventListener("click", () => closeDialog());
    body.append(h("div", { class: "dialog-actions" }, close));
    return;
  }
  closeDialog();
}

function paintMessageBox(body) {
  setText($("dialog-title"), "Message the team");
  body.append(h("div", { class: "to-options", role: "group", "aria-label": "Who to write to" }));
  const host = body.querySelector(".to-options");
  // The three targets the message box has always had (MG6, D4). The page names no provider and no model.
  [["architect", "Architect", "the design session"], ["henry", "Henry", "your assistant"], ["orchestrator", "Orchestrator", "the lanes' controller"]].forEach(([value, label, sub]) => {
    const picked = view.ui.to === value;
    const option = h("label", { class: picked ? "picked" : "", "data-focus": "to:" + value },
      h("input", { type: "radio", name: "cc-to", value, checked: picked ? "checked" : null }),
      h("span", null, h("span", { text: label }), h("small", { text: sub })));
    option.querySelector("input").addEventListener("change", () => { view.ui.to = value; paintDialog(); });
    host.append(option);
  });
  const box = h("textarea", { id: "cmp-msg", rows: "5", "data-focus": "msg-text", placeholder: "Write it the way you would say it" });
  box.value = view.ui.msg || "";
  box.addEventListener("input", (event) => { view.ui.msg = event.target.value; saveDraft("msg", event.target.value); syncMsgSend(); });
  body.append(h("label", { class: "field-label", for: "cmp-msg", text: "Your words" }), box);
  if (view.ui.dialogError) body.append(h("p", { class: "dialog-error", role: "alert", text: view.ui.dialogError }));
  const send = h("button", { class: "btn btn-solid", type: "button", id: "cmp-send", text: "Send" });
  send.disabled = String(view.ui.msg || "").trim() === "";
  send.addEventListener("click", () => sendMessage());
  const cancel = h("button", { class: "btn", type: "button", text: "Cancel" });
  cancel.addEventListener("click", () => closeDialog());
  body.append(h("div", { class: "dialog-actions" }, cancel, send));
}

function syncMsgSend() {
  const button = $("cmp-send");
  if (button) button.disabled = String(view.ui.msg || "").trim() === "";
}

function openDialog() {
  const wrap = $("dialog-wrap");
  if (!wrap || !wrap.hidden) return;
  opener.node = document.activeElement;
  wrap.hidden = false;
  document.addEventListener("keydown", onDialogKey, true);
  const first = document.querySelector("#dialog-body textarea, #dialog-body input, #dialog-close");
  if (first) first.focus();
}

function closeDialog() {
  const wrap = $("dialog-wrap");
  if (!wrap || wrap.hidden) return;
  wrap.hidden = true;
  document.removeEventListener("keydown", onDialogKey, true);
  view.ui.dialog = null;
  view.ui.dialogError = null;
  const body = $("dialog-body");
  if (body) body.textContent = "";
  const back = opener.node;
  opener.node = null;
  if (back && typeof back.focus === "function" && back.isConnected) back.focus();
}

function onDialogKey(event) {
  if (event.key === "Escape") { event.preventDefault(); closeDialog(); return; }
  if (event.key !== "Tab") return;
  const wrap = $("dialog-wrap");
  if (!wrap) return;
  const items = Array.prototype.slice.call(wrap.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter((item) => !item.disabled && item.offsetParent !== null);
  if (items.length === 0) return;
  const index = items.indexOf(document.activeElement);
  const last = items.length - 1;
  let next;
  if (event.shiftKey) next = index <= 0 ? last : index - 1;
  else next = index === last || index < 0 ? 0 : index + 1;
  event.preventDefault();
  items[next].focus();
}

// ── The toast, the banner and the words kept across a reload ────────────────
let toastUndo = null;
function showToast(text, undoLabel, undoAction) {
  const toast = $("toast");
  if (!toast) return;
  toastUndo = typeof undoAction === "function" ? undoAction : null;
  toast.show({ title: text, undo: toastUndo !== null ? undoLabel || "Undo" : null });
}
function hideToast() {
  const toast = $("toast");
  if (toast) toast.hide();
  toastUndo = null;
}
function showBanner(text, actionLabel, action) {
  const banner = $("banner");
  const actionButton = $("banner-action");
  if (!banner) return;
  banner.hidden = false;
  setText($("banner-text"), text);
  if (actionButton) {
    actionButton.hidden = typeof action !== "function";
    actionButton.textContent = actionLabel || "Reload";
    actionButton.onclick = typeof action === "function" ? action : null;
  }
}
function hideBanner() {
  const banner = $("banner");
  if (banner) banner.hidden = true;
}
function showRestart() {
  view.restartPending = true;
  showBanner("The gateway restarted. Reload for the current state.", "Reload", () => location.reload());
}

const DRAFT_KEY = "cc-drafts";
function loadDrafts() {
  try {
    const raw = window.localStorage.getItem(DRAFT_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    Object.keys(saved).forEach((key) => {
      if (typeof saved[key] !== "string" || saved[key] === "") return;
      if (key === "msg") view.ui.msg = saved[key];
      else drafts[key] = saved[key];
    });
  } catch (error) { /* storage may be off: the box still works for this page */ }
}
function saveDraft(key, value) {
  try {
    const saved = JSON.parse(window.localStorage.getItem(DRAFT_KEY) || "{}");
    if (value === "" || value === null || value === undefined) delete saved[key];
    else saved[key] = String(value);
    window.localStorage.setItem(DRAFT_KEY, JSON.stringify(saved));
  } catch (error) { /* nothing to do: the draft lives in memory this time */ }
}
function hasUnsentWords() {
  if (String(view.ui.msg || "").trim() !== "") return true;
  return Object.keys(drafts).some((key) => String(drafts[key] || "").trim() !== "");
}

// ── Focus, kept across a repaint ───────────────────────────────────────────
function focusKeyOf() {
  const active = document.activeElement;
  if (!active || !active.closest) return null;
  const holder = active.closest("[data-focus]");
  return holder ? holder.dataset.focus : null;
}
function restoreFocus(key) {
  if (!key) return;
  const target = document.querySelector('[data-focus="' + key.replace(/"/g, '\\"') + '"]');
  if (target && document.activeElement !== target) {
    target.focus();
    if (target.setSelectionRange && typeof target.value === "string") target.setSelectionRange(target.value.length, target.value.length);
  }
}
function restoreFocusRaw(node) { if (node && node.isConnected && typeof node.focus === "function") node.focus(); }

// ── The stream, the offline rule and the poll (Q5, CRW 4) ──────────────────
function onFrame(kind, event) {
  frameSeen();
  if (kind === "state") {
    let state = null;
    try { state = JSON.parse(event.data); } catch (error) { return; }
    if (state) applyState(state);
    return;
  }
  if (kind === "panels") {
    let frame = null;
    try { frame = JSON.parse(event.data); } catch (error) { return; }
    if (frame) applyPanels(frame);
    return;
  }
  // A ping proves the stream is alive and carries nothing else: frameSeen above has already done the work.
}

function frameSeen() {
  if (offlineTimer !== null) clearTimeout(offlineTimer);
  offlineTimer = setTimeout(goOffline, OFFLINE_MS);
  if (pollTimer !== null) { clearTimeout(pollTimer); pollTimer = null; }
  if (!view.online) {
    view.online = true;
    view.stale = false;
    hideBanner();
    paintChrome();
  }
}

function goOffline() {
  offlineTimer = null;
  view.online = false;
  view.stale = true;
  paintChrome();
  showBanner("Can't reach the gateway. Last update " + hhmm(view.loadedAt) + ".", "Try now", () => refresh());
  schedulePoll();
}

function schedulePoll() {
  if (pollTimer !== null) return;
  pollTimer = setTimeout(() => { pollTimer = null; refresh().then(() => schedulePoll()); }, POLL_MS);
}

function openStream() {
  if (stream || typeof EventSource === "undefined") return;
  stream = new EventSource("/cc/api/live");
  stream.addEventListener("state", (event) => onFrame("state", event));
  stream.addEventListener("panels", (event) => onFrame("panels", event));
  stream.addEventListener("ping", (event) => onFrame("ping", event));
  stream.onerror = () => {
    // The browser retries on its own; a closed stream is reopened when the page is visible again.
    if (stream && stream.readyState === 2) stream = null;
  };
}

function refresh() {
  return fetch("/cc/api/state", { cache: "no-store", headers: { accept: "application/json" } })
    .then((response) => {
      if (response.status === 403) { showRestart(); return null; }
      if (!response.ok) { showToast("The gateway answered " + response.status + ".", null, null); return null; }
      return response.json();
    })
    .then((state) => {
      if (!state) return null;
      applyState(state);
      // `/cc/api/messages` is a route of the tailnet listener only. The loopback listener does not serve it, so the
      // state says when the view may have the message text (MG7): the page asks for it only then, and never asks a
      // listener for a route it does not have.
      if (!msgView.loaded && !msgView.countsOnly) return loadMessages();
      return null;
    })
    .catch(() => null);
}

function applyState(state) {
  view.loadedAt = state.generatedAt || view.loadedAt;
  const startedAt = typeof state.startedAt === "string" ? state.startedAt : null;
  if (view.startedAt !== null && startedAt !== null && startedAt !== view.startedAt) {
    // D11: the gateway restarted. Typed words are kept, so nothing is lost by reloading, but never silently.
    if (hasUnsentWords()) showRestart();
    else { location.reload(); return; }
  }
  view.startedAt = startedAt;
  view.state = state;
  view.recent = Array.isArray(state.recent) ? state.recent.slice(-20) : view.recent;
  msgView.countsOnly = Boolean(state.countsOnly);
  renderAll();
}

function applyPanels(frame) {
  if (!view.state) return;
  if (frame.generatedAt) view.loadedAt = frame.generatedAt;
  if (frame.summary) view.state.summary = frame.summary;
  if (frame.panels) {
    Object.keys(frame.panels).forEach((name) => {
      if (name === "summary") view.state.summary = frame.panels.summary;
      else view.state.panels[name] = frame.panels[name];
    });
  }
  const changes = Array.isArray(frame.changes) ? frame.changes : [];
  if (changes.length > 0) {
    view.recent = view.recent.concat(changes).slice(-20);
    showChangeLine(changes[changes.length - 1]);
  }
  renderAll();
  refreshLaneSheet();
}

// ── Routes: a view is a hash, a sheet is a hash on top (CRW 7) ─────────────
function parseHash() {
  const raw = String(location.hash || "").replace(/^#/, "");
  const parts = raw.split("/");
  const kind = parts[0] || "today";
  const id = parts.slice(1).join("/") || null;
  if (kind === "lane" && id) return { kind: "lane", id };
  if (kind === "goal" && id) return { kind: "goal", id };
  if (kind === "today" || kind === "goals" || kind === "scrum" || kind === "pipeline" || kind === "history" || kind === "systems") return { kind, id: null };
  return { kind: "today", id: null };
}

function hashOf(kind, id) { return "#" + kind + (id ? "/" + id : ""); }

function go(kind, id) {
  const next = hashOf(kind, id);
  if (location.hash === next) { applyRoute(); return; }
  history.pushState(null, "", next);
  applyRoute();
}

function openGoal(code) { go("goal", code); }

function openLane(laneId) {
  const row = laneRow(laneId);
  if (!row) { showToast("That lane is not in the state any more.", null, null); return; }
  loadFeed(laneId, false).then(() => {
    openLaneSheet(laneRow(laneId) || row);
    if (route.kind !== "lane" || route.id !== laneId) go("lane", laneId);
  });
}

function closeLaneSheet(routeAfter) {
  const sheet = $("lane-sheet");
  if (sheet && sheet.isOpen) sheet.close({ silent: true });
  if (route.kind === "lane") {
    if (routeAfter && routeAfter.kind !== "lane") { applyRoute(); return; }
    go(viewRoute().kind, viewRoute().id);
  }
}

function applyRoute() {
  const next = parseHash();
  const wasLane = route.kind === "lane";
  route.kind = next.kind;
  route.id = next.id;
  if (next.kind === "lane") openLaneFromRoute();
  else if (wasLane) {
    const sheet = $("lane-sheet");
    if (sheet && sheet.isOpen) sheet.close({ silent: true });
  }
  paintView();
}

/** A lane route opens its sheet over the view beneath, however late the state arrives (CRW 7). */
function openLaneFromRoute() {
  const sheet = $("lane-sheet");
  if (!sheet || route.kind !== "lane") return;
  const row = laneRow(route.id);
  if (!row) {
    if (!view.state) return;
    showToast("That lane is not in the state any more.", null, null);
    if (sheet.isOpen) sheet.close({ silent: true });
    route.kind = "today";
    route.id = null;
    if (location.hash !== hashOf("today", null)) history.replaceState(null, "", hashOf("today", null));
    paintView();
    return;
  }
  if (sheet.isOpen && sheet.dataset.lane === row.laneId) { sheet.data = laneSheetData(row); return; }
  if (!view.feeds[row.laneId]) {
    loadFeed(row.laneId, false).then(() => { if (route.kind === "lane" && route.id === row.laneId) openLaneSheet(laneRow(row.laneId) || row); });
    return;
  }
  openLaneSheet(row);
}

// ── Modes and the first paint ──────────────────────────────────────────────
const NS = "http://www.w3.org/2000/svg";
// Icons are built node by node: this page never parses a string into markup.
const DARK_ICON = [{ tag: "circle", attrs: { cx: "12", cy: "12", r: "4" } }, { tag: "path", attrs: { d: "M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" } }];
const LIGHT_ICON = [{ tag: "path", attrs: { d: "M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" } }];
const CLOSE_ICON = [{ tag: "path", attrs: { d: "M6 6l12 12M18 6L6 18" } }];

function svgNode(shapes, className) {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", className || "g-i");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.7");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("aria-hidden", "true");
  shapes.forEach((shape) => {
    const piece = document.createElementNS(NS, shape.tag);
    Object.keys(shape.attrs).forEach((name) => piece.setAttribute(name, shape.attrs[name]));
    svg.append(piece);
  });
  return svg;
}

function applyMode(theme) {
  const next = theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  const button = $("mode");
  if (!button) return;
  const goingLight = next === "dark";
  button.setAttribute("aria-label", goingLight ? "Switch to light mode" : "Switch to dark mode");
  const holder = $("mode-icon");
  if (holder) {
    clear(holder);
    holder.append(svgNode(next === "dark" ? DARK_ICON : LIGHT_ICON));
  }
}

function currentTheme() {
  try {
    const saved = window.localStorage.getItem("cc-theme");
    if (saved === "light" || saved === "dark") return saved;
  } catch (error) { /* storage off: follow the system */ }
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}

function renderAll() {
  paintView();
  paintMessages();
  openLaneFromRoute();
}

function wire() {
  const nav = $("nav");
  if (nav) nav.addEventListener("g-select", (event) => {
    const id = event.detail.id;
    if (!id) return;
    // Setting the tab from the route must not read back as a tap: only a different view navigates.
    const current = route.kind === "goal" ? "goals" : route.kind;
    if (id === current) return;
    go(id);
  });
  const island = $("island");
  if (island) island.addEventListener("g-tap", (event) => {
    if (event.detail.action !== "pc") return;
    view.ui.dialog = { kind: "pc" };
    paintDialog();
  });
  const sheet = $("lane-sheet");
  if (sheet) sheet.addEventListener("g-tap", onLaneSheetTap);
  // R7a.1: on a phone History and Systems sit under More, so the row keeps the four controls it had (D40).
  const moreButton = $("more-btn");
  if (moreButton) moreButton.addEventListener("click", (event) => {
    event.stopPropagation();
    const open = $("more-menu") !== null && $("more-menu").classList.contains("open");
    closeMore();
    if (!open) openMore();
  });
  const moreMenu = $("more-menu");
  if (moreMenu) moreMenu.addEventListener("click", (event) => {
    const target = event.target.closest("button[data-more]");
    if (!target) return;
    closeMore();
    go(target.getAttribute("data-more"));
  });
  document.addEventListener("click", (event) => {
    const menu = $("more-menu");
    if (!menu || !menu.classList.contains("open")) return;
    if (menu.contains(event.target) || (moreButton && moreButton.contains(event.target))) return;
    closeMore();
  });
  const toast = $("toast");
  if (toast) toast.addEventListener("g-undo", () => { if (toastUndo) { const run = toastUndo; toastUndo = null; run(); } });
  const mode = $("mode");
  if (mode) mode.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyMode(next);
    try { window.localStorage.setItem("cc-theme", next); } catch (error) { /* nothing to keep */ }
  });
  const openMsg = $("open-msg");
  if (openMsg) openMsg.addEventListener("click", () => openMessage());
  const closeButton = $("dialog-close");
  if (closeButton) {
    closeButton.append(svgNode(CLOSE_ICON));
    closeButton.addEventListener("click", () => closeDialog());
  }
  window.addEventListener("popstate", () => applyRoute());
  // A typed hash, a link or the phone's back gesture all land here, so one route function serves them all.
  window.addEventListener("hashchange", () => applyRoute());
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    const menu = $("more-menu");
    if (menu && menu.classList.contains("open")) { closeMore(); return; }
    const dialog = $("dialog-wrap");
    if (dialog && !dialog.hidden) { closeDialog(); return; }
    const sheet = $("lane-sheet");
    if (sheet && sheet.isOpen) { if (route.kind === "lane") history.back(); else sheet.close({ silent: true }); }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    // A phone back from the background: a closed stream is reopened, and the state is read again.
    if (!stream) openStream();
    refresh();
  });
  window.addEventListener("pagehide", () => {
    // A tap still inside its six-second hold is sent with keepalive: the tab is going away, the answer is not lost.
    Object.keys(held).forEach((id) => { if (!held[id].posted) postAnswer(id, true); });
    Object.keys(heldCards).forEach((id) => { if (!heldCards[id].posted) postCard(id, true); });
  });
  window.addEventListener("online", () => { if (!stream) openStream(); refresh(); });
}

function boot() {
  applyMode(currentTheme());
  loadDrafts();
  wire();
  const start = parseHash();
  route.kind = start.kind === "lane" ? "today" : start.kind;
  route.id = start.kind === "lane" ? null : start.id;
  paintView();
  paintChrome();
  frameSeen();
  openStream();
  refresh();
  // A load never opens a lane sheet: a tap is the only way in (the operator, 2026-10-29). The address is rewritten in
  // place instead, so a refresh cannot bring the sheet back, and the back gesture still leaves a tapped sheet.
  if (start.kind === "lane") history.replaceState(null, "", hashOf("today", null));
}

boot();
</script>
</body>
