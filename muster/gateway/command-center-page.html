<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="cc-csrf" content="__CC_CSRF__">
<title>Command center</title>
<!-- Revision 7 (D34, D35): the design is the vendored graphite-ui library, served from this listener under the same CSP as this page. -->
<link rel="stylesheet" href="/cc/assets/ui/tokens.css">
<link rel="stylesheet" href="/cc/assets/ui/components.css">
<style>
/* The page owns layout only: the palette, the glass and every element's own styling live in the library. */
/* Item 5 (the operator, 2026-10-29): the page never pans sideways on a phone. The real causes are fixed at their own
   boxes; this is the backstop, and it is `clip` rather than `hidden` because `hidden` still makes a scroll container
   the page can be scrolled into. */
html { background: var(--ground); overflow-x: clip; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14px/1.45 var(--font);
  font-feature-settings: "tnum" 1, "ss01" 1; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: clip; }
::selection { background: var(--sel); color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 10px; }
* { scrollbar-width: thin; scrollbar-color: var(--glass-3) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--glass-3); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
[hidden] { display: none !important; }

/* Light DOM elements are blocks on this page. */
g-nav, g-island, g-kpi, g-board, g-goal-card, g-sheet, g-chips, g-line-chart, g-donut, g-hbars, g-feed { display: block; }
g-kpi, g-goal-card { height: 100%; }
/* The chart's bare peak number sits where the panel's own aside goes; the aside states the peak instead. */
g-line-chart .g-ylab { display: none; }
/* A long model name wraps inside the donut's legend rather than being clipped at the panel's edge. */
g-donut .g-legend { min-width: 0; }
g-donut .g-legend-item { min-width: 0; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }

/* ---------- the ground (mockup's graphite, one wave, drifting glass) ---------- */
.ground { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: radial-gradient(120% 80% at 80% -10%, var(--ground-2), transparent 60%), var(--ground); }
.ground svg { position: absolute; left: -10%; width: 120%; top: 38%; height: 70%; opacity: .9; }
.glass { background: var(--glass); border-radius: var(--r-card); box-shadow: var(--shadow);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); position: relative; }
@media (prefers-reduced-transparency: reduce) { .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--ground-2); } }

/* ---------- shell and top bar ---------- */
.shell { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 18px var(--gutter) 64px; }
.topbar { position: sticky; top: 12px; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; gap: 16px; margin-bottom: 14px; }
.brand { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 8px; border-radius: var(--r-pill); justify-self: start; font-weight: 600; min-width: 0; max-width: 100%; }
/* The brand's own name is cut with an ellipsis rather than pushing the Message button off the edge. */
.brand > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; background: var(--inv); color: var(--inv-ink); display: grid; place-items: center; }
.actions { justify-self: end; display: flex; gap: 8px; align-items: center; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); transition: color .15s, background .15s; }
.iconbtn:hover { color: var(--ink); background: var(--glass-2); }
.pillbtn { height: 44px; padding: 0 18px 0 14px; border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 8px;
  font-weight: 600; background: var(--inv); color: var(--inv-ink); transition: transform .15s var(--ease-out); }
.pillbtn:active { transform: scale(.97); }
/* The live island sits in the middle of the top bar. Its line is cut with an ellipsis inside its own pill, never
   past the edge of the screen (D1): a change line is one line of text, whatever it carries. */
.navwrap { min-width: 0; display: flex; justify-content: center; }
.navwrap g-island { min-width: 0; width: 100%; max-width: 100%; }
/* The library's paint puts the pill inside a `div.g-island` that is an inline-flex box: its width is its content's, so
   a max-width in percent has nothing to resolve against and a long change line ran past the screen. Here it is a
   block-width flex container, so the pill is clamped by the column and its line is cut with an ellipsis. */
.navwrap .g-island { display: flex; justify-content: center; min-width: 0; width: 100%; max-width: 100%; }
.navwrap .g-island-b { min-width: 0; max-width: 100%; overflow: hidden; }
.navwrap .g-island-line, .navwrap .g-island-last { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.g-i { width: 18px; height: 18px; }
.navrow { display: flex; margin-bottom: 22px; }
.banner { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 10px 14px; border-radius: var(--r-inner);
  background: var(--due-soft, var(--chip)); color: var(--due-ink); font-size: 13px; }

/* ---------- view head ---------- */
.head { display: flex; align-items: flex-end; gap: 28px; margin: 6px 0 22px; flex-wrap: wrap; }
.title { font-size: 34px; line-height: 1.05; font-weight: 650; letter-spacing: -0.03em; margin: 0; }
.title small { display: block; font-size: 14px; letter-spacing: 0; font-weight: 450; color: var(--ink-3); margin-top: 6px; }
.dim { color: var(--ink-3); }
.attn { color: var(--due-ink); }
.bad { color: var(--bad-ink); }
.note { color: var(--ink-3); font-size: 12.5px; margin: 8px 0 0; }

/* ---------- Today ---------- */
.kpis { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1.55fr); gap: 14px; margin-bottom: 22px; }
.today-grid { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 12px; gap: 12px; }
.sec-h h2 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.sec-h .aside { color: var(--ink-3); font-size: 12.5px; }
.goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.side > section { padding: 18px; margin-bottom: 14px; }
.side h2 { font-size: 15px; margin: 0; font-weight: 650; }
.steps { list-style: none; margin: 12px 0 0; padding: 0; }
.steps li { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--edge); align-items: flex-start; }
.steps li:first-child { border-top: 0; }
.steps .c { font-size: 11px; font-weight: 650; color: var(--ink-3); min-width: 44px; padding-top: 2px; }
.steps .t { flex: 1; font-size: 13px; min-width: 0; }
.steps .t small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.steps .age { font-size: 12px; color: var(--ink-3); white-space: nowrap; padding-top: 2px; }
.steps .age.stale { color: var(--bad-ink); }
.linkbtn { min-height: 40px; font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; margin-top: 6px; padding: 6px 0; }
.linkbtn:hover { color: var(--ink); }
.decided { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 11.5px; font-weight: 550; padding: 3px 9px; border-radius: var(--r-pill); background: var(--chip); color: var(--ink-2); white-space: nowrap; }
.tag.you { background: var(--inv); color: var(--inv-ink); }
.tag.back { color: var(--due-ink); background: color-mix(in srgb, var(--due) 13%, transparent); }
.shiplist { list-style: none; padding: 0; margin: 10px 0 0; }
.shiplist li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--edge); font-size: 13px; }
.shiplist li:first-child { border-top: 0; }
.shiplist time { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
.shiplist .g { font-size: 11px; display: block; margin-top: 2px; color: var(--tint, var(--ink-3)); }
.empty { color: var(--ink-3); font-size: 13px; margin: 10px 0 0; }

/* Tickets: the decisions and steps that need the operator (R5/R6, restyled). */
.tk { border-top: 1px solid var(--edge); padding: 10px 0; }
.tk:first-child { border-top: 0; }
.tk.bad { border-left: 2px solid var(--bad-ink); padding-left: 10px; }
.scrum { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.scrum-cols { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); margin-top: 8px; }
.scrum-col { min-width: 0; }
.scrum-col h3 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; margin: 0 0 6px; font-size: 13px; font-weight: 650; }
.scrum-col h3 small { color: var(--ink-3); font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
.scrum-col .tk-row { padding: 6px 0; border-top: 1px solid var(--line, rgba(0,0,0,.08)); min-width: 0; }
.scrum-col .tk-row:first-of-type { border-top: 0; }
.scrum .tk-row { padding: 6px 0; min-width: 0; }
.scrum .tk-row .t span { overflow-wrap: anywhere; }
@media (min-width: 720px) { .scrum-cols { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); } }
.tk-row { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; }
.tk-row .c { font-size: 11px; font-weight: 650; color: var(--ink-3); min-width: 44px; padding-top: 2px; }
.tk-row .t { flex: 1; font-size: 13px; min-width: 0; }
.tk-row .t small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.tk-row .age { font-size: 12px; color: var(--ink-3); white-space: nowrap; padding-top: 2px; }
.tk-body { margin: 10px 0 0 54px; }
.taps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tap { min-height: 36px; padding: 8px 12px; border-radius: var(--r-inner); background: var(--chip); color: var(--ink);
  font-size: 13px; font-weight: 550; text-align: left; }
.tap.main { background: var(--inv); color: var(--inv-ink); }
.tap small { display: block; font-size: 10.5px; opacity: .8; font-weight: 500; }
.field-label { display: block; font-size: 12.5px; color: var(--ink-3); margin: 0 0 6px; }
textarea, input[type="text"] { width: 100%; box-sizing: border-box; font: inherit; color: var(--ink); background: var(--glass-2);
  border: 1px solid var(--edge); border-radius: var(--r-inner); padding: 10px 12px; resize: vertical; }
textarea { min-height: 62px; }
.send-row, .dialog-actions, .thread-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
.btn { min-height: 36px; padding: 0 14px; border-radius: var(--r-pill); background: var(--chip); color: var(--ink); font-size: 13px; font-weight: 600; }
.btn-solid { background: var(--inv); color: var(--inv-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.answered { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px;
  background: var(--glass-2); border-radius: var(--r-inner); padding: 8px 12px; }
.sitting > .sit-head { display: flex; gap: 8px; align-items: baseline; }
.sitting > .sit-head span { color: var(--ink-3); font-size: 12px; }
.ticket-body .empty { margin-top: 4px; }
.kicker { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }

/* Ideas (R6.1) */
.idea { border-top: 1px solid var(--edge); padding: 10px 0; }
.idea:first-child { border-top: 0; }
.idea-title { font-size: 13px; font-weight: 600; display: block; }
.idea-meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--ink-3); font-size: 12px; margin-top: 4px; align-items: center; }
.idea-why { color: var(--ink-2); font-size: 12.5px; margin: 6px 0 0; }
.idea-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.verdict .dot, .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--ink-4); }
.dot-ok { background: var(--good); }
.dot-attention { background: var(--due); }
.dot-red { background: var(--bad); }
.idea-link { display: inline-flex; gap: 5px; align-items: center; color: var(--ink-2); min-height: 32px; padding: 4px 0; }

/* Messages (MG7) */
.msg-strip { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
.msg-strip.ok { color: var(--good-ink); }
.msg-strip.error { color: var(--bad-ink); }
.msg-strip.attention { color: var(--due-ink); }
.msgrow { border-top: 1px solid var(--edge); }
.msgrow:first-child { border-top: 0; }
.msgrow button, .msgrow .static { width: 100%; text-align: left; padding: 10px 0; display: block; }
.msg-top { display: flex; gap: 10px; justify-content: space-between; font-size: 13px; }
.msg-side { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.msg-side.needs-you { color: var(--due-ink); }
.msg-preview { color: var(--ink-3); font-size: 12.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread { max-height: 44vh; overflow: auto; border: 1px solid var(--edge); border-radius: var(--r-inner); padding: 10px; }
.thread-msg { margin-bottom: 10px; }
.thread-msg p { margin: 0; font-size: 13px; }
.thread-msg time { font-size: 11px; color: var(--ink-3); }
.thread-msg.mine p { color: var(--ink); }
.dialog-note, .reply-note { color: var(--ink-3); font-size: 12.5px; margin: 8px 0; }
.dialog-error { color: var(--bad-ink); font-size: 12.5px; margin: 8px 0; }
.to-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.to-options label { display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: var(--r-pill); background: var(--chip); font-size: 13px; }
.to-options label.picked { background: var(--inv); color: var(--inv-ink); }
.to-options small { display: block; font-size: 11px; opacity: .75; }
.report-text { white-space: pre-wrap; font: 400 13px/1.5 var(--font); margin: 10px 0 0; max-height: 60vh; overflow: auto; }

/* ---------- the goal board ---------- */
.back { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: var(--r-pill);
  color: var(--ink-2); font-weight: 550; margin-bottom: 14px; background: var(--glass); }
.hero { border-radius: 26px; padding: 26px 28px; margin-bottom: 18px; position: relative; overflow: hidden;
  background: linear-gradient(135deg, color-mix(in srgb, var(--tint) 34%, var(--ground)) 0%, color-mix(in srgb, var(--tint) 16%, var(--ground)) 100%);
  color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 26px 50px -24px color-mix(in srgb, var(--tint) 45%, transparent); }
[data-theme="light"] .hero { background: linear-gradient(135deg, color-mix(in srgb, var(--tint) 30%, #fff) 0%, color-mix(in srgb, var(--tint) 12%, #fff) 100%); }
.hero h1 { font-size: 32px; letter-spacing: -0.03em; margin: 0 0 8px; line-height: 1.1; font-weight: 650; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
.hero p { margin: 0; max-width: 62ch; }
.track { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 20px; }
.station { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: var(--r-pill); font-size: 12.5px;
  font-weight: 550; background: rgba(255,255,255,0.08); }
[data-theme="light"] .station:not(.now) { background: rgba(255,255,255,0.55); }
.station .s { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid currentColor; }
.station.done { color: var(--ink); }
.station.done .s { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.station.now { background: var(--inv); color: var(--inv-ink); }
.station.now .s::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--inv-ink); }
.chips-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.filters button { height: 32px; padding: 0 12px 0 10px; border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 550; color: var(--ink-2); background: var(--glass); }
.filters button[aria-pressed="true"] { background: var(--inv); color: var(--inv-ink); }
.filters button i { width: 7px; height: 7px; border-radius: 50%; background: var(--tint, var(--ink-3)); }
.filters button span { opacity: .7; }
.board-wrap { padding: 14px; border-radius: 26px; overflow: hidden; }
.board-h { display: flex; justify-content: space-between; align-items: center; margin: 2px 6px 12px; gap: 12px; }
.board-h h2 { margin: 0; font-size: 15px; font-weight: 650; }
.board-h .aside { color: var(--ink-3); font-size: 12.5px; }

/* ---------- History ---------- */
.hist { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.panel { padding: 18px; }
.panel.wide { grid-column: 1 / -1; }
.panel h2 { font-size: 15px; margin: 0; font-weight: 650; }
.panel .aside { color: var(--ink-3); font-size: 12.5px; display: block; margin-bottom: 10px; }
.seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: var(--r-pill); background: var(--glass); margin-bottom: 16px; }
.seg button { height: 30px; padding: 0 14px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 550; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--inv); color: var(--inv-ink); }

/* ---------- Systems (M1, D41): the plans as last read ---------- */
.sys-sec { margin: 0 0 30px; }
.lead { padding: 14px 18px; margin: 0 0 14px; border-radius: var(--r-inner); font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.lead b { color: var(--ink); font-weight: 650; }
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.plan { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.plan-top { display: grid; gap: 3px; }
.plan-name { font-weight: 650; font-size: 15.5px; line-height: 1.25; letter-spacing: -0.01em; }
.plan-price { font-size: 12.5px; color: var(--ink-3); }
.plan-note { margin: 0; font-size: 12px; color: var(--ink-3); }
.wins { display: grid; gap: 11px; }
.win-label { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.win-label .r { color: var(--ink-3); text-align: right; white-space: nowrap; }
.win-label .r b { color: var(--ink); font-weight: 650; }
.win-bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.win-bar i { display: block; height: 100%; border-radius: 4px; background: var(--ink-2); }
.win.walled .win-bar i { background: var(--due); }
.plan-lines { list-style: none; margin: auto 0 0; padding: 12px 0 0; border-top: 1px solid var(--edge); display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.plan-lines li.dim { color: var(--ink-3); font-size: 12px; }
.sys-two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
.sys-two .panel { padding: 16px 18px 8px; }
.sys-two .steps .v { font-size: 13px; color: var(--ink-2); text-align: right; }
.sys-two .steps .v.attn { color: var(--due-ink); }
.sys-two .steps .v.dim { color: var(--ink-3); }
/* ---------- Services (spec §4, OL6): every contract, with the age of its proof ---------- */
.contracts { padding: 4px 0; }
.contract { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 18px; font-size: 12.5px; color: var(--ink-2); }
.contract + .contract { border-top: 1px solid var(--edge); }
.contract .cid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contract .age { color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.contract-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.contract.red { color: var(--due-ink); }
.contract.red .contract-dot { background: var(--due); }
.contract.red .age { color: var(--due-ink); }
/* The phone keeps four controls in the nav row: History and Systems sit under More (R7a.1, D40). */
.morebtn { display: none; }
.more-menu { position: fixed; z-index: 30; min-width: 190px; padding: 6px; border-radius: var(--r-inner); opacity: 0; pointer-events: none; transform: translateY(-6px); transition: opacity .18s, transform .18s var(--ease-out); }
.more-menu.open { opacity: 1; transform: none; pointer-events: auto; }
.more-menu button { display: flex; align-items: center; width: 100%; min-height: 44px; padding: 0 16px; border-radius: var(--r-inner); color: var(--ink-2); font-weight: 550; text-align: left; }
.more-menu button:hover { color: var(--ink); background: var(--glass-2); }
.more-menu button[aria-current="page"] { background: var(--inv); color: var(--inv-ink); }

/* ---------- the sheets ---------- */
#dialog-wrap { position: fixed; inset: 0; z-index: 30; }
#dialog { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.42); }
#dialog .g-sheet-panel { width: min(560px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; }
.sheet-offline { color: var(--due-ink); font-size: 12.5px; }

/* ---------- the plans rings (the operator, 2026-10-29): a ring keeps its own circle ---------- */
/* The rings sit in a card as wide as the phone, and the library's four-column cluster squeezed each one below its own
   68 px: the arc spilled into the neighbour's column and the number stopped sitting in its own circle. Each ring now
   takes the room it draws itself in, and the cluster fits as many rings as the card holds. */
.g-rings { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 12px 8px; }
.g-ring { min-width: 0; }
.g-ring-wrap { width: 68px; height: 68px; flex: none; }
.g-ring-sub { max-width: 100%; overflow-wrap: anywhere; }

/* ---------- the page's own width (D1): nothing here is wider than the viewport ---------- */
/* A grid track sized `1fr` is `minmax(auto, 1fr)`, and `auto` is the item's minimum-content size: one long word, one
   line that cannot wrap or one nowrap preview is enough to grow a track past the screen. So every track may shrink,
   every item may shrink, and every text may break inside its own box. */
.today-grid > *, .kpis > *, .goals > *, .hist > *, .sys-two > *, .plans > *, .side { min-width: 0; }
.tk-row .t, .steps .t, .idea-title, .idea-why, .shiplist li, .g-kpi-line, .g-ring-label, .g-ring-sub, .g-tt, .g-nm, .g-sub { overflow-wrap: anywhere; }
/* The message preview cannot wrap by design (one line, an ellipsis): its box is cut instead of the panel it is in. */
.msgrow button { overflow: hidden; }
/* The library's own pills carry a lane's title and never wrap: they are cut inside their card, not past the screen. */
.g-tags .g-tag, .g-model { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

/* ---------- the phone (D38: 760 px) ---------- */
@media (max-width: 760px) {
  .shell { padding: 12px var(--gutter) 48px; }
  .topbar { grid-template-columns: minmax(0, 1fr) auto; row-gap: 10px; top: 8px; }
  .brand { height: 40px; padding: 0 12px 0 6px; font-size: 13px; }
  .navwrap { grid-column: 1 / -1; order: 3; }
  .navwrap g-island { width: 100%; }
  .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .kpis > :first-child, .kpis > :nth-child(4), .kpis > :nth-child(5) { grid-column: 1 / -1; }
  .today-grid, .goals, .hist { grid-template-columns: minmax(0, 1fr); }
  .hero { padding: 20px; border-radius: 22px; }
  .hero h1 { font-size: 26px; }
  .title { font-size: 27px; }
  .board-wrap { padding: 12px; }
  /* All four tab labels fit at 390 px: tighter tabs, and the row scrolls inside itself if a count grows. */
  .navrow { overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; scroll-padding-inline: 10px; }
  .navrow::-webkit-scrollbar { display: none; }
  .navrow g-nav { min-width: max-content; }
  .navrow .g-nav { gap: 0; padding: 4px; }
  .navrow .g-nav-tab { padding: 0 7px; font-size: 12px; min-width: 0; }
  .navrow .g-nav-n { min-width: 16px; height: 16px; padding: 0 4px; }
  .navrow .g-nav-tab[data-id="history"], .navrow .g-nav-tab[data-id="systems"] { display: none; }
  .navrow .morebtn { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; margin-left: 4px; border-radius: var(--r-pill);
    font-size: 12.5px; font-weight: 550; color: var(--ink-2); white-space: nowrap; }
  .navrow .morebtn[aria-current="page"] { background: var(--inv); color: var(--inv-ink); }
  .sys-two { grid-template-columns: minmax(0, 1fr); }
  .navwrap g-island .g-island-last, .navwrap g-island .g-island-sep { display: none; }
  .brand { white-space: nowrap; font-size: 12.5px; }
  .tk-body { margin-left: 0; }
  .iconbtn { width: 40px; height: 40px; }
  .pillbtn { height: 40px; padding: 0 14px 0 12px; font-size: 13px; }

// ── end of the Systems words ────────────────────────────────────────────────────────────────────────────────────

function daysAgo(ageMs) {
  if (typeof ageMs !== "number" || !isFinite(ageMs) || ageMs < 0) return "new";
  const days = Math.floor(ageMs / 86400000);

}
function elapsedText(sinceMs) {

  const minutes = Math.max(0, Math.round((Date.now() - sinceMs) / 60000));
  if (minutes < 60) return minutes + "m";
  const hours = Math.floor(minutes / 60);

}

// ── State access ─────────────────────────────────────────────────────────────
// The summary is its own key of the state, as it always was (D32); every other panel hangs under panels.

}
function panelData(name) { const p = panel(name); return p && !p.error && p.data ? p.data : null; }

function panelError(name) { const p = panel(name); return p && p.error ? p.error : null; }
function stateStages() {

  return stages.slice(0, STAGE_FACTS.length);
}
function stageIndexOf(key) {

  return -1;
}
function stageLabel(key) {

}
function laneRows() {

  return data && Array.isArray(data.rows) ? data.rows : [];
}
function seatLanes() {

}
/** The worker lanes: no seat holds them and their origin is not the operator (R5, the composer's own `workerRows` rule). */
function workerLanes() {

}
function onBoard(row) { return stageIndexOf(row.stage) >= 0; }
function goalPanel() { return panelData("goals"); }
function goalGroups() {

  return data && Array.isArray(data.groups) ? data.groups : [];
}
function goalList() {

  goalGroups().forEach((group) => {
    (Array.isArray(group.goals) ? group.goals : []).forEach((goal) => {

}
function goalBy(code) {

}

function tintOf(code) {

}
function summaryData() {
  const p = panel("summary");
  return p && !p.error && p.data ? p.data : null;
}

}


// ── The chrome: nav, island, banner ─────────────────────────────────────────
function islandIdle() {
  const summary = summaryData();
  if (summary && summary.working && summary.review) {

    return plural(summary.working.count, "working", "working") + " · " + review + " in review";
  }
  const workers = workerLanes();
  const working = workers.filter((row) => { const index = stageIndexOf(row.stage); return index >= 0 && STAGE_FACTS[index].now; }).length;
  const review = workers.filter((row) => stageIndexOf(row.stage) === 2 || stageIndexOf(row.stage) === 4).length;
  return plural(working, "working", "working") + " · " + review + " in review";

function activeLaneCount() {

function teamRows() {
  const data = panelData("team");

  const rows = members.map((member) => {

function pcRow() {

// ── The view: what is on the page, built once and then kept up to date ───────
const views = { kind: null, id: null, root: null };
function viewRoute() {
  if (route.kind === "lane") return { kind: views.kind || "today", id: views.id || null };
  return { kind: route.kind, id: route.id };
}

function paintView() {
  const main = $("view");
  if (!main) return;
  const next = viewRoute();
  if (views.kind !== next.kind || views.id !== next.id || !views.root || !main.contains(views.root)) buildView(main, next.kind, next.id);
  refreshView(views.kind);
}

function buildView(main, kind, id) {
  const saved = focusKeyOf();
  const root = h("div", { class: "view" });
  clear(main);
  views.parts = {};
  if (kind === "goal") buildGoalView(root, id);
  else if (kind === "pipeline") buildPipelineView(root);
  else if (kind === "scrum") buildScrumView(root);
  else if (kind === "history") buildHistoryView(root);
  else if (kind === "systems") buildSystemsView(root);

  views.kind = kind;
  views.id = id;
  views.root = root;
  restoreFocus(saved);

function refreshView(kind) {
  const saved = focusKeyOf();
  if (kind === "goal") refreshGoalView();
  else if (kind === "pipeline") refreshPipelineView();

function paintKpis() {

function paintGoalCards() {
  const host = $("goals");
  if (!host) return;
  const goals = goalList();
  const noGoalLanes = workerLanes().filter((row) => !row.goal);
  if (view.state && goals.length === 0 && noGoalLanes.length === 0) {
    if (host.dataset.empty !== "1") { clear(host); host.append(h("p", { class: "empty", text: EMPTY.noGoals })); host.dataset.empty = "1"; }
    return;
  }
  if (host.dataset.empty === "1") { clear(host); delete host.dataset.empty; }
  const wanted = goals.map((goal) => goal.code);
  const keep = {};
  [...host.querySelectorAll("g-goal-card")].forEach((card) => {
    const code = card.dataset.code;
    if (code !== undefined && wanted.indexOf(code) >= 0 && !keep[code]) keep[code] = card;
    else if (code === "none" && noGoalLanes.length > 0) keep.none = card;
    else card.remove();
  });
  goals.forEach((goal, index) => {
    const code = goal.code;
    let card = keep[code];
    if (!card) {
      card = document.createElement("g-goal-card");
      card.dataset.code = code;
      card.addEventListener("g-select", (event) => openGoal(event.detail.id));
      host.insertBefore(card, host.children[index] || null);
    } else if (host.children[index] !== card) host.insertBefore(card, host.children[index] || null);
    card.data = goalCardData(goal);
  });
  if (noGoalLanes.length > 0) {
    let card = keep.none;
    if (!card) {
      card = document.createElement("g-goal-card");
      card.dataset.code = "none";
      card.addEventListener("g-select", () => openGoal("none"));
    }
    host.append(card);
    card.data = noGoalCardData(noGoalLanes);
  } else if (keep.none) keep.none.remove();
}

function goalCardData(goal) {
  const lanes = workerLanes().filter((row) => row.goal === goal.code);
  const counts = stateStages().map((stage) => lanes.filter((row) => row.stage === stage.key).length);
  const stations = Array.isArray(goal.stations) ? goal.stations : [];
  const nowStation = stations.filter((station) => station.now)[0] || stations.filter((station) => !station.done)[0] || null;
  const mergedIndex = STAGE_FACTS.findIndex((fact) => fact.merged);
  const active = lanes.filter((row) => { const index = stageIndexOf(row.stage); return index >= 0 && !STAGE_FACTS[index].merged; });
  const tags = [];
  if (Array.isArray(goal.waitsOn) && goal.waitsOn.length > 0) tags.push({ text: "Waits on you", tone: "you" });
  active.slice(0, 4).forEach((row) => {
    tags.push({ text: row.title + " · " + stageLabel(row.stage).toLowerCase(), tone: row.rounds > 0 ? "back" : null });
  });
  return {
    code: goal.code,
    name: goal.name,
    project: goal.projectTitle,
    sub: goal.sub,
    done: stations.filter((station) => station.done).length,
    total: stations.length,
    // The plate under the goal's name is the goal's own progress (the operator, 2026-10-29): one mark per station, filled
    // for the stations that are done, so 3 of 6 fills half of it — the same count the circle beside it shows.
    strip: stations.map((item) => ({ key: item.name, label: item.name, count: item.done ? 1 : 0, tone: item.done ? "done" : null })),
    now: nowStation ? nowStation.name : null,
    mergedToday: mergedIndex >= 0 ? counts[mergedIndex] : 0,
    tags,
    tint: goal.colour
  };
}

function noGoalCardData(lanes) {
  const counts = stateStages().map((stage) => lanes.filter((row) => row.stage === stage.key).length);
  const mergedIndex = STAGE_FACTS.findIndex((fact) => fact.merged);
  return {
    code: null,
    name: "Lanes with no goal",
    project: "",
    sub: "Lanes launched without a goal",
    done: 0,
    total: 0,
    // No stations, no plate: a goal with no stations shows the same nothing its ring does.
    strip: [],
    now: null,
    mergedToday: mergedIndex >= 0 ? counts[mergedIndex] : 0,
    tags: lanes.slice(0, 4).map((row) => ({ text: row.title + " · " + stageLabel(row.stage).toLowerCase(), tone: row.rounds > 0 ? "back" : null })),
    tint: null
  };
}

// ── The board (goal view and Pipeline) ──────────────────────────────────────
function laneCardData(row) {
  const index = stageIndexOf(row.stage);
  const fact = index >= 0 ? STAGE_FACTS[index] : null;
  const when = fact && fact.merged ? hhmm(row.since) : elapsedText(row.startedAt) || (row.since ? hhmm(row.since) : "");
  return {
    id: row.laneId,
    title: row.title || row.laneId,
    chip: [row.class, row.taskKind].filter(Boolean).join(" · ") || null,
    when,
    rounds: row.rounds || 0,
    now: fact && fact.now ? row.now : null,
    waits: row.waits || null,
    model: row.modelName || null,
    attention: row.tone === "attention" ? row.reason || "Needs a look" : null,
    tint: tintOf(row.goal),
    goalCode: row.goal || null
  };
}

function boardData(rows, options) {
  const cap = options && Number(options.cap) ? options.cap : 0;
  const stages = stateStages();
  let phoneStart = null;
  const columns = stages.map((stage, index) => {
    let cards = rows.filter((row) => row.stage === stage.key);
    if (STAGE_FACTS[index].merged) cards = cards.slice().sort((left, right) => (right.since || 0) - (left.since || 0));
    const shown = cap > 0 ? cards.slice(0, cap) : cards;
    if (shown.length > 0 && phoneStart === null) phoneStart = stage.key;
    return {
      key: stage.key,
      label: stage.label,
      empty: STAGE_FACTS[index].empty,
      accent: STAGE_FACTS[index].accent,
      cards: shown.map(laneCardData),
      more: cards.length - shown.length
    };
  });
  return { phoneStart, columns };
}

/** R7.1 on a phone: the board opens at the first column that holds a lane, not at an empty one. */
function startBoardAt(board, data) {
  if (!board || !data || !data.phoneStart) return;
  if (!window.matchMedia || !window.matchMedia("(max-width: 760px)").matches) return;
  const scroller = board.querySelector(".g-board");
  const column = board.querySelector('.g-col[data-phone-start="true"]');
  if (scroller && column) scroller.scrollLeft = Math.max(0, column.offsetLeft - scroller.offsetLeft);
}

function wireBoard(board) {
  if (board.dataset.wired === "1") return;
  board.dataset.wired = "1";
  board.addEventListener("g-select", (event) => openLane(event.detail.id));
  board.addEventListener("g-tap", (event) => {
    if (event.detail.action === "more") go("history");
  });
}

    if (median) setText(median, trouble);
    return;
  }
  if (!range) {
    if (median) setText(median, "Nothing recorded for this range yet.");
    return;
  }
  const merges = Array.isArray(range.merges) ? range.merges : [];
  const perDay = view.ui.range !== "today";
  const byModelRows = Array.isArray(range.byModel) ? range.byModel : [];
  const chipsNode = $("history-chips");
  if (chipsNode) {
    chipsNode.data = {
      chips: [
        { label: view.ui.range === "today" ? "lanes done today" : "lanes done", value: range.lanes, icon: "merge" },
        { label: "fix rounds sent back", value: byModelRows.reduce((sum, row) => sum + row.sentBack, 0), icon: "back" }
      ]
    };
  }
  // The mockup labels every third hour. The library lays its labels out evenly rather than pinning each to its
  // hour, so one tick per hour collides on a phone; which ticks to keep is the page's data, not the chart's.
  const every = perDay ? Math.max(1, Math.ceil(merges.length / 8)) : 3;
  const labels = merges.map((point, index) => {
    if (index % every !== 0) return "";
    const at = new Date(point.at);
    return perDay
      ? new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Sofia", day: "2-digit", month: "short" }).format(at)
      : String(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Sofia", hour: "2-digit", hour12: false }).format(at)).padStart(2, "0") + ":00";
  }).filter((label) => label !== "");
  const peak = merges.reduce((most, point) => Math.max(most, point.count), 0);
  const mergeSub = $("history-merge-sub");
  // The axis peak belongs in the panel's own words: the library prints it bare, where a lone "1" reads as a typo.
  if (mergeSub) setText(mergeSub, "Hover or touch the line to read an hour · peak " + peak + (peak === 1 ? " lane" : " lanes"));
  if (chart) chart.data = { title: perDay ? "Lanes finished per day" : "Lanes finished per hour today", points: merges.map((point) => point.count), unit: "lanes", labels };
  const byModel = Array.isArray(range.byModel) ? range.byModel : [];
  const totalLanes = byModel.reduce((sum, row) => sum + row.lanes, 0);
  const modelsSub = $("history-models-sub");
  if (modelsSub) setText(modelsSub, totalLanes === 0 ? "No lane in this range" : totalLanes + " lanes with a recorded model");
  if (donut) donut.data = { segments: byModel.map((row) => ({ label: row.name, value: row.lanes })), centre: { big: totalLanes, small: "lanes" } };
  if (rounds) {
    const maxRounds = Math.max(1, ...byModel.map((row) => row.rounds));
    rounds.data = { rows: byModel.map((row) => ({ label: row.name, value: row.rounds, max: maxRounds, display: row.rounds + " rounds · " + row.sentBack + "/" + row.lanes + " back", tint: null })) };
  }
  if (goals) {
    const byGoal = Array.isArray(range.byGoal) ? range.byGoal : [];
    const maxLanes = Math.max(1, ...byGoal.map((row) => row.lanes));
    goals.data = {
      rows: byGoal.map((row) => {
        const goal = row.code ? goalBy(row.code) : null;
        return {
          label: row.code === null ? "No goal recorded" : goal ? goal.name : row.code,
          value: row.lanes,
          max: maxLanes,
          display: String(row.lanes),
          tint: row.code ? tintOf(row.code) : null
        };
      })
    };
  }
  if (median) {
    const ms = range.medianLaunchToMergeMs;
    setText(median, typeof ms === "number" && isFinite(ms) ? elapsedSpan(ms) : "Not known yet: no merged lane in this range carries both times.");
  }
}

function elapsedSpan(ms) {
  const minutes = Math.round(ms / 60000);
  if (minutes < 60) return minutes + " min";
  const hours = minutes / 60;
  return (hours < 10 ? hours.toFixed(1) : String(Math.round(hours))) + " h";
}


// ── What needs you: decisions, steps, and what you decided today ─────────────
function tickets() {
  const data = panelData("decisions");
  if (!data || !Array.isArray(data.tickets)) return [];
  return data.tickets.filter((ticket) => ticket.status === "open" || ticket.status === "awaiting-operator");
}
function kindLabel(kind) { return KIND_LABELS[kind] || kind; }
function canSend(id) { return (drafts[id] || "").trim() !== ""; }
function syncSend(id) { const button = $("send-" + id); if (button) button.disabled = !canSend(id); }

function paintWaiting() {
  const host = $("tickets");
  if (!host) return;
  clear(host);
  const list = tickets();
  const more = $("all-steps");
  const decidedHost = $("decided");
  if (decidedHost) {
    clear(decidedHost);
    const summary = summaryData();
    const decided = summary && Array.isArray(summary.decidedToday) ? summary.decidedToday : [];
    decided.forEach((entry) => {
      const tag = h("span", { class: "tag", text: entry.code + " decided" });
      if (entry.question) tag.setAttribute("title", entry.question);

  }
  if (more) {

    more.textContent = "";
  }

  if (panelMissing("decisions")) { host.append(h("li", { class: "empty", text: EMPTY.notWired })); return; }
  if (panelError("decisions")) { host.append(h("li", { class: "empty", text: panelError("decisions") })); return; }
  if (list.length === 0) { host.append(h("li", { class: "empty", text: EMPTY.nothingWaits })); return; }

  // R6.1: the steps only the operator can do group into one "Next sitting" card at the place of the highest-ranked step.
  const units = [];
  let sitting = null;
  list.forEach((ticket) => {
    if (ticket.sitting) {
      if (!sitting) { sitting = { steps: [] }; units.push(sitting); }
      sitting.steps.push(ticket);
    } else units.push({ ticket });
  });
  const shown = view.ui.more ? units : units.slice(0, 5);
  shown.forEach((unit) => { host.append(unit.steps ? sittingNode(unit.steps) : ticketNode(unit.ticket)); });
  if (units.length > 5 && more) {
    const hidden = units.slice(5).reduce((sum, unit) => sum + (unit.steps ? unit.steps.length : 1), 0);
    more.hidden = false;
    more.textContent = view.ui.more ? "Show fewer" : "Show " + hidden + " more";
    more.setAttribute("aria-expanded", view.ui.more ? "true" : "false");
    more.onclick = () => { view.ui.more = !view.ui.more; paintWaiting(); };

}

function sittingNode(steps) {
  const card = h("li", { class: "tk sitting" },
    h("div", { class: "sit-head" }, h("b", { text: "Next sitting" }), h("span", { text: plural(steps.length, "step", "steps") + " only you can do" })));
  const list = h("ul", { class: "steps" });
  steps.forEach((step) => list.append(ticketNode(step)));
  card.append(list);
  return card;
}

function ticketNode(ticket) {
  const isOpen = view.ui.openTicket === ticket.id;
  const blocking = Array.isArray(ticket.blocks) && ticket.blocks.length > 0;
  const item = h("li", { class: "tk" + (blocking ? " bad" : "") });
  const row = h("button", {
    class: "tk-row", type: "button", "aria-expanded": isOpen ? "true" : "false", "data-focus": "ticket:" + ticket.id
  },
    h("span", { class: "c", text: ticket.code || "" }),
    h("span", { class: "t" },
      h("span", { text: ticket.question }),
      blocking ? h("small", { text: "Blocks " + ticket.blocks.join(", ") }) : null,
      h("small", { text: kindLabel(ticket.kind) })),
    h("span", { class: "age" + (ticket.stale ? " stale" : ""), text: daysAgo(ticket.ageMs) }));
  row.addEventListener("click", () => { view.ui.openTicket = isOpen ? null : ticket.id; paintWaiting(); });
  item.append(row);

  if (held[ticket.id]) { item.append(heldNode(ticket)); return item; }
  if (!isOpen) return item;

  const body = h("div", { class: "tk-body" });
  if (ticket.answerOnCard) { body.append(h("p", { class: "empty", text: "Answer it on its card." })); item.append(body); return item; }
  const options = Array.isArray(ticket.options) ? ticket.options : [];
  if (options.length > 0) {
    // D15/D16: the composer names the recommended option; a tap is a tap answer, never the operator's words.
    const recommended = typeof ticket.recommended === "string" && options.indexOf(ticket.recommended) >= 0 ? ticket.recommended : null;
    const ordered = recommended === null ? options : [recommended].concat(options.filter((option) => option !== recommended));
    body.append(h("div", { class: "kicker", text: "Tap an answer" }));
    const taps = h("div", { class: "taps", role: "group", "aria-label": "Answers for " + (ticket.code || "this ticket") });
    ordered.forEach((option, index) => {
      const main = option === recommended;
      const button = h("button", { class: "tap" + (main ? " main" : ""), type: "button", "data-focus": "tap:" + ticket.id + ":" + index },
        h("span", { text: option }), main ? h("small", { text: "Recommended" }) : null);
      button.addEventListener("click", () => tapAnswer(ticket, option));
      taps.append(button);
    });
    body.append(taps);
  }
  const words = h("textarea", {
    id: "words-" + ticket.id, rows: "2", "data-focus": "ask:" + ticket.id, placeholder: "Your words, in your own way"
  });
  words.value = drafts[ticket.id] || "";
  words.addEventListener("input", (event) => { drafts[ticket.id] = event.target.value; saveDraft(ticket.id, event.target.value); syncSend(ticket.id); });
  body.append(h("label", { class: "field-label", for: "words-" + ticket.id, text: options.length > 0 ? "Or answer in your own words" : "Your words" }), words);
  const send = h("button", { class: "btn btn-solid", type: "button", id: "send-" + ticket.id, text: "Send answer" });
  send.disabled = !canSend(ticket.id);
  send.addEventListener("click", () => sendAnswer(ticket));
  body.append(h("div", { class: "send-row" }, send));
  item.append(body);
  return item;
}

function heldNode(ticket) {
  const record = held[ticket.id];
  // A tap is never shown as the operator's words (D15).
  const said = record && typeof record.option === "string"
    ? (ticket.code || "Ticket") + " answered with " + record.option + "."
    : (ticket.code || "Ticket") + " answered. It reached the queue as your words.";
  const undo = h("button", { class: "btn", type: "button", text: "Undo" });
  undo.addEventListener("click", () => undoAnswer(ticket.id));
  return h("div", { class: "answered" }, h("span", { text: said }), undo);
}

// ── From the PC (WP1c) ──────────────────────────────────────────────────────
function pcPending() {
  const p = panel("pendingPc");
  return p && !p.error && Array.isArray(p.data) ? p.data : [];
}
function payloadLines(payload) {
  return Object.keys(payload).map((key) => {
    const value = payload[key];
    return key + ": " + (typeof value === "string" ? value : JSON.stringify(value));
  }).join("\n");
}
function minutesLeft(row) {
  // The state's own clock, so the page and the gateway agree however far apart their clocks are.
  const left = Date.parse(row.expiresAt) - Date.parse(view.state.generatedAt);
  if (!(left > 0)) return "expires now";
  const minutes = Math.ceil(left / 60000);
  return "expires in " + minutes + (minutes === 1 ? " minute" : " minutes");
}
function pcActionNode(row) {
  const label = PC_KIND_LABELS[row.kind] || row.kind;
  const head = h("div", { class: "tk-row" }, h("span", { class: "c", text: label }), h("span", { class: "t", text: minutesLeft(row) }));
  if (!row.payload) return h("div", { class: "tk" }, head, h("p", { class: "empty", text: "Waiting for your tap on the phone" }));
  const confirm = h("button", { class: "btn btn-solid", type: "button", "data-focus": "pc-confirm:" + row.id, text: "Confirm" });
  confirm.addEventListener("click", (event) => settlePc(row, true, event.currentTarget));
  const reject = h("button", { class: "btn", type: "button", "data-focus": "pc-reject:" + row.id, text: "Reject" });
  reject.addEventListener("click", (event) => settlePc(row, false, event.currentTarget));
  return h("div", { class: "tk", "data-pending": row.id }, head,
    h("pre", { class: "report-text", text: payloadLines(row.payload) }),
    h("div", { class: "send-row" }, confirm, reject));
}
function paintFromPc() {
  const card = $("from-pc");
  const host = $("pc-actions");
  if (!card || !host) return;
  const rows = pcPending();
  card.hidden = rows.length === 0;

}
function settlePc(row, confirmIt, button) {
  const buttons = button.parentNode.querySelectorAll("button");
  buttons.forEach((node) => { node.disabled = true; });
  fetch("/cc/api/" + (confirmIt ? "confirm" : "reject") + "/" + encodeURIComponent(row.id), {
    method: "POST",
    cache: "no-store",
    headers: { "content-type": "application/json", "x-cc-csrf": CSRF },
    body: JSON.stringify(confirmIt ? { digest: row.digest } : {})
  }).then((response) => response.json().catch(() => null).then((data) => ({ status: response.status, data })))
    .then((result) => {
      if (result.status === 200) showToast(confirmIt ? "Done: " + (PC_KIND_LABELS[row.kind] || row.kind) + "." : "Dropped.", null, null);
      else if (result.status === 403) { showRestart(); return; }
      else if (result.status === 410) showToast("That action expired or was already handled.", null, null);
      else if (result.status === 409) showToast("It changed since you saw it. Check it again.", null, null);
      else showToast(String((result.data && result.data.error) || "The action was refused."), null, null);
      refresh();
    })
    .catch(() => {
      buttons.forEach((node) => { node.disabled = false; });
      showToast("The tap did not reach the gateway.", null, null);
    });
}
function showPcWaiting() { showToast("Waiting for your tap on the phone.", null, null); }
